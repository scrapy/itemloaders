[tox]
envlist = py310,py311,py312,py313,py314

[testenv]
deps =
    pytest
    pytest-cov >= 7.0.0

commands =
    pytest \
        --cov-report=term --cov-report=html --cov-report= --cov=itemloaders \
        --doctest-modules \
        {posargs:itemloaders tests}

[testenv:min]
basepython = python3.10
deps =
    {[testenv]deps}
    itemadapter==0.1.0
    jmespath==0.9.5
    parsel==1.5.0
    # parsel 1.5.0 uses cssselect._unicode_safe_getattr, removed in cssselect 1.2.0
    cssselect==1.1.0

[testenv:benchmark]
basepython = python3.14
deps =
    {[testenv:extra-deps]deps}
    pytest-codspeed
passenv =
    *codspeed*
    *ci*
commands =
    pytest --no-cov --codspeed --codspeed-mode=simulation tests/benchmarks/

[testenv:extra-deps]
deps =
    {[testenv]deps}
    attrs
    scrapy

[testenv:pypy3]
basepython = pypy3

[docs]
changedir = docs
deps =
    -rdocs/requirements.txt
setenv =
    READTHEDOCS_PROJECT=itemloaders
    READTHEDOCS_VERSION=master

[testenv:docs]
basepython = python3
changedir = {[docs]changedir}
deps = {[docs]deps}
setenv = {[docs]setenv}
commands =
    sphinx-build -W -b html . {envtmpdir}/html

[testenv:twinecheck]
basepython = python3
deps =
    twine==6.2.0
    build==1.4.0
commands =
    python -m build --sdist
    twine check dist/*

[testenv:typing]
basepython = python3
deps =
    mypy==2.3.0
    attrs==26.1.0
    pytest==9.1.1
    pytest-codspeed==5.0.3
    Scrapy==2.17.0
    types-jmespath==1.1.0.20260508
commands =
    mypy {posargs:itemloaders tests}

[testenv:pre-commit]
basepython = python3
deps =
    pre-commit
commands =
    pre-commit run {posargs:--all-files}

[testenv:pylint]
deps =
    {[testenv]deps}
    pylint==4.0.4
commands =
    pylint docs itemloaders tests
